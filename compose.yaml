# Drop-in AMR emulators for an integration test stack:
#   docker compose up -d
#   curl http://localhost:8080/api/v2.0.0/status  (MiR; auth: distributor/sha256)
#   mosquitto_sub -p 1883 -t 'vda5050/v3/+/+/state'  (VDA 5050)
services:
  vda5050:
    build:
      context: .
      dockerfile: Dockerfile.vda5050
    command: ["--robots", "2"]
    ports:
      - "1883:1883"
  mir-381:
    build: .
    command: ["--mir-version", "3.8.1"]
    ports:
      - "8080:8080"
  mir-2147:
    build: .
    command: ["--mir-version", "2.14.7"]
    ports:
      - "8081:8080"
