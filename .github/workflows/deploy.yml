name: Deploy demo

# Prod path for the public demo (amr-emulator.com, legacy alias mir.advin.io):
# master-only, OIDC-assumed
# role that can only drive CloudFormation + the artifacts bucket. Resource
# permissions live in the CloudFormation service role (deploy/github-oidc.yaml).

on:
  push:
    branches: [master]
    paths:
      - packages/mir-emulator/**
      - deploy/template.yaml
      - docs/index.html
      - docs/landing.html
      - docs/vda5050.html
      - docs/omron.html
      - scripts/deploy_demo.sh
      - .github/workflows/deploy.yml
      - uv.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build bundle, deploy stack, smoke test
        env:
          CFN_ROLE_ARN: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
          DOMAIN_NAME: amr-emulator.com
          LEGACY_DOMAIN_NAME: mir.advin.io
        run: ./scripts/deploy_demo.sh
