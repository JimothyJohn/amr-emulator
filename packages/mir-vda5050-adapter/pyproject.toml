[project]
name = "mir-vda5050-adapter"
dynamic = ["version"]
description = "VDA 5050 robot-side adapter for the MiR robot REST API — drive a MiR (real or emulated) from any VDA 5050 master control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "vda5050-emulator",
    "httpx>=0.27",
]

[project.scripts]
mir-vda5050-adapter = "mir_vda5050_adapter.cli:main"

[tool.hatch.version]
path = "src/mir_vda5050_adapter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mir_vda5050_adapter"]

[tool.uv.sources]
vda5050-emulator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
