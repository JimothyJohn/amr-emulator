[project]
name = "vda5050-master"
dynamic = ["version"]
description = "Programmable VDA 5050 master control — fleet discovery, missions compiled to orders, and full order-lifecycle management over MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "vda5050-emulator",
]

[tool.hatch.version]
path = "src/vda5050_master/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vda5050_master"]

[tool.uv.sources]
vda5050-emulator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
