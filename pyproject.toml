# Virtual workspace root — the installable packages live under packages/.
# `uv sync --all-packages` installs every member plus the dev group.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.165.10",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "pytest-cov>=7.1.0",
    "openapi-python-client>=0.29.0",
    # Interop oracle for the embedded VDA 5050 MQTT broker: proves the
    # hand-rolled broker speaks MQTT 3.1.1 with the ecosystem's canonical
    # client. Dev-only; zero required transitive dependencies (Eclipse, EPL-2.0).
    "paho-mqtt>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/mir-emulator/tests",
    "packages/mir-mcp/tests",
    "packages/mir-spec-scraper/tests",
    "packages/mir-client/tests",
    "packages/vda5050-emulator/tests",
    "packages/mir-vda5050-adapter/tests",
    "packages/arcl-emulator/tests",
    "packages/vda5050-master/tests",
    "packages/massrobotics-emulator/tests",
]
markers = [
    "integration: tests that boot a real emulator server over TCP",
    "live_portal: tests that hit the real MiR support portal (needs MIR_PORTAL_EMAIL/MIR_PORTAL_PASSWORD)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
# mir_client/{robot,fleet} are generated verbatim (scripts/generate_client.py)
# and follow the generator's style, not ours; the drift check guards them.
extend-exclude = [
    "packages/mir-client/src/mir_client/robot",
    "packages/mir-client/src/mir_client/fleet",
]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "S101", # assert is the point of pytest
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S310"] # hardcoded test creds / test URLs are intentional
# Interop harnesses deliberately shell out to docker with fixed argv and bind
# 0.0.0.0 so the container can reach the host-side broker.
"interop/**" = ["S104", "S603", "S607"]

[tool.ty.src]
exclude = [
    "packages/mir-client/src/mir_client/robot",
    "packages/mir-client/src/mir_client/fleet",
    # ROS 2 code that only runs inside the interop container (rclpy et al.
    # are not installable on the host).
    "interop/otto-vda5050/mock_adapter",
]
